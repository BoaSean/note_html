<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 手册</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ========== 主页视图 ========== */
  body.home-view {
    display: block;
  }

  body.home-view .sidebar,
  body.home-view #menuToggle { display: none; }

  body.home-view .content { display: none; }

  .home-container {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    padding: 60px 20px 40px;
  }

  body.home-view .home-container { display: flex; }

  .home-container h1 { font-size: 2rem; margin-bottom: 8px; }
  .home-container > p { color: #5c6370; margin-bottom: 40px; }

  .grid-5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    max-width: 1200px;
    width: 100%;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .col-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: #5c6370;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .section-title {
    font-size: 1rem;
    margin: 40px 0 16px;
    color: #abb2bf;
  }

  .manual-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #282c34;
    border: 1px solid #181a1f;
    border-radius: 8px;
    padding: 14px 16px;
    text-decoration: none;
    color: #abb2bf;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
    min-height: 48px;
  }

  .ext-link {
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 0.75rem;
    color: #5c6370;
    text-decoration: none;
    line-height: 1;
  }

  .ext-link:hover {
    color: #61afef;
  }

  .manual-card:hover {
    border-color: #61afef;
    transform: translateY(-2px);
  }

  .manual-card h2 { font-size: 0.88rem; font-weight: 600; margin: 0; }
  /* 书签卡片 */
  .bm-card {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #282c34;
    border: 1px solid #181a1f;
    border-radius: 8px;
    padding: 14px 16px;
    text-decoration: none;
    color: #abb2bf;
    font-size: 0.88rem;
    font-weight: 600;
    transition: border-color 0.2s, transform 0.15s;
    min-height: 48px;
  }

  .bm-card:hover {
    border-color: #98c379;
    transform: translateY(-2px);
  }

  .home-footer { color: #5c6370; font-size: 0.8rem; margin-top: 60px; }

  /* 侧边栏返回按钮 */
  .back-home {
    display: inline-block;
    font-size: 0.78rem;
    color: #5c6370;
    cursor: pointer;
    margin-top: 4px;
  }
  .back-home:hover { color: #61afef; }
</style>
</head>
<body class="home-view">

  <!-- ==================== 侧边栏（查看器模式） ==================== -->
  <button class="menu-toggle" id="menuToggle">
    <span></span><span></span><span></span>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>API 手册</h1>
      <span class="back-home">← 返回首页</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- ==================== 文档内容区（查看器模式） ==================== -->
  <main class="content" id="content"></main>

  <!-- ==================== 主页 ==================== -->
  <div class="home-container" id="homeContainer">
    <h1>API 手册</h1>
    <p>选择一个手册开始查阅</p>
    <div class="grid-5">
      <!-- 列1: Tool -->
      <div class="col">
        <div class="col-title">Tool</div>
        <div class="manual-card" data-manual="tool" data-url="null">
          <h2>Tool</h2>
        </div>
      </div>
      <!-- 列2: ISO C + ISO C++ -->
      <div class="col">
        <div class="col-title">ISO C / ISO C++</div>
        <div class="manual-card" data-manual="c_ANSI" data-url="null">
          <h2>ANSI/ISO C</h2>
        </div>
        <div class="manual-card" data-manual="cpp_ISO" data-url="null">
          <h2>ISO C++</h2>
        </div>
      </div>
      <!-- 列3: STM32 HAL + FreeRTOS + LVGL -->
      <div class="col">
        <div class="col-title">STM32</div>
        <div class="manual-card" data-manual="stm_hal" data-url="null">
          <h2>STM32 HAL</h2>
        </div>
        <div class="manual-card" data-manual="freertos" data-url="freertos_API">
          <h2>FreeRTOS</h2>
        </div>
        <div class="manual-card" data-manual="null" data-url="RTThread_API">
          <h2>RT-Thread</h2>
        </div>
        <div class="manual-card" data-manual="lvgl" data-url="null">
          <h2>LVGL</h2>
        </div>
      </div>
      <!-- 列4: Linux 驱动 + C Linux -->
      <div class="col">
        <div class="col-title">Linux</div>
        <div class="manual-card" data-manual="linux_driver" data-url="null">
          <h2>Linux 驱动</h2>
        </div>
        <div class="manual-card" data-manual="c_Linux" data-url="null">
          <h2>C Linux</h2>
        </div>
      </div>
      <!-- 列5: Demo -->
      <div class="col">
        <div class="col-title">Demo</div>
        <div class="manual-card" data-manual="default" data-url="null">
          <h2>示例 API</h2>
        </div>
        <div class="manual-card" data-manual="payment" data-url="null">
          <h2>支付 API</h2>
        </div>
      </div>
    </div>

    <!-- ⭐ 收藏网站 -->
    <h2 class="section-title">⭐ 常用网站</h2>
    <div class="grid-5" id="bookmarks">
      <div class="col"><a class="bm-card" href="https://github.com" target="_blank">GitHub</a></div>
      <div class="col"><a class="bm-card" href="https://developer.mozilla.org" target="_blank">MDN</a></div>
      <div class="col"><a class="bm-card" href="https://stackoverflow.com" target="_blank">Stack Overflow</a></div>
      <div class="col"><a class="bm-card" href="https://docs.python.org" target="_blank">Python Docs</a></div>
      <div class="col"><a class="bm-card" href="https://en.wikipedia.org" target="_blank">Wikipedia</a></div>
    </div>

    <div class="home-footer">个人 API 手册 · 基于 Markdown · python -m http.server</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
